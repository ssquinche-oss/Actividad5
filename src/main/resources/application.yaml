server:
  port: 8083
  error:
    include-message: always
#Configuracion de spring
spring:
  application:
    name: Actividad5
  #Configuracion de migracion
  flyway:
    enabled: true
    baselineVersion: 1
    locations: classpath:db/migration
    sqlMigrationSuffixes: .sql
    baselineOnMigrate: true
    sqlMigrationPrefix: V
    schemas: public

  datasource:
    url: jdbc:postgresql://localhost:5432/actividad5
    username: postgres
    password: postgres123
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true